# .github/workflows/ci.yml
# Pipeline CI — Kanban MVP Backend
# Lint + type-check + tests unitarios + tests de integración
# Se ejecuta en cada PR y push a staging/main.
# Un PR no puede mergearse si cualquier step falla.

name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

# Cancela ejecuciones anteriores del mismo PR al recibir un nuevo push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────
  # JOB 1: Lint y type-check
  # ─────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff — linting
        run: ruff check app/ tests/

      - name: Ruff — verificar formato
        run: ruff format --check app/ tests/

      - name: Mypy — type checking
        run: mypy app/

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Tests unitarios e integración
  # ─────────────────────────────────────────────────────────────
  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kanban_ci
          POSTGRES_PASSWORD: kanban_ci_pass
          POSTGRES_DB: kanban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: development
      DEBUG: "true"
      ENABLE_DOCS: "false"
      # asyncpg — usado por SQLAlchemy async en la app
      DATABASE_URL: postgresql+asyncpg://kanban_ci:kanban_ci_pass@localhost:5432/kanban_test
      # psycopg2 — usado por Alembic (modo síncrono)
      DATABASE_URL_SYNC: postgresql+psycopg2://kanban_ci:kanban_ci_pass@localhost:5432/kanban_test
      TEST_DATABASE_URL: postgresql+asyncpg://kanban_ci:kanban_ci_pass@localhost:5432/kanban_test
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      RESEND_API_KEY: ${{ secrets.CI_RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ci@kanban-test.local
      EMAIL_DEV_MODE: "true"
      CORS_ORIGINS: http://localhost:5173
      RATE_LIMIT_ENABLED: "false"
      TESTING: "true"

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Instalar psycopg2 para Alembic
        run: pip install psycopg2-binary

      - name: Esperar a que PostgreSQL esté listo
        run: |
          until pg_isready -h localhost -p 5432 -U kanban_ci; do
            echo "Esperando PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL listo ✓"

      - name: Aplicar migraciones Alembic
        run: alembic upgrade head

      - name: Tests unitarios
        run: |
          pytest tests/unit/ \
            --tb=short \
            --quiet \
            -v

      - name: Tests de integración con cobertura
        run: |
          pytest tests/integration/ \
            --tb=short \
            --quiet \
            -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Publicar reporte de cobertura en Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage.xml
          fail_ci_if_error: false