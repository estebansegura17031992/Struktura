# pyproject.toml

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
ignore = ["E501", "B008"]

exclude = ["alembic/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
# Para el MVP: solo errores críticos, no exigir anotaciones en todo el código
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false        # ← no exigir -> None en todas las funciones
check_untyped_defs = false           # ← no analizar el interior de funciones sin tipos
warn_return_any = false
warn_unused_ignores = false
exclude = ["alembic/"]
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",        # solo registra routers, poco lógica
    "app/dependencies.py",  # solo funciones para inyectar dependencias, poco lógica
    "alembic/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]